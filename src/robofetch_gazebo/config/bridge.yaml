# ros_gz_bridge parameter_bridge configuration.
# Each entry maps a gz transport topic to a ROS 2 topic and declares the direction.
# gz.msgs.* are Gazebo message types; the *_msgs/msg/* are their ROS 2 equivalents.

# Command velocity: ROS -> Gazebo (teleop / Nav2 controller drives the robot)
- ros_topic_name: "cmd_vel"
  gz_topic_name: "cmd_vel"
  ros_type_name: "geometry_msgs/msg/Twist"
  gz_type_name: "gz.msgs.Twist"
  direction: ROS_TO_GZ

# Wheel odometry: Gazebo -> ROS. Also the distance source for the robot state model.
- ros_topic_name: "odom"
  gz_topic_name: "odom"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS

# odom -> base_footprint transform published by DiffDrive: Gazebo -> ROS
- ros_topic_name: "tf"
  gz_topic_name: "tf"
  ros_type_name: "tf2_msgs/msg/TFMessage"
  gz_type_name: "gz.msgs.Pose_V"
  direction: GZ_TO_ROS

# Wheel joint angles (so robot_state_publisher can rotate the wheels): Gazebo -> ROS
- ros_topic_name: "joint_states"
  gz_topic_name: "joint_states"
  ros_type_name: "sensor_msgs/msg/JointState"
  gz_type_name: "gz.msgs.Model"
  direction: GZ_TO_ROS

# Lidar scan: Gazebo -> ROS
- ros_topic_name: "scan"
  gz_topic_name: "scan"
  ros_type_name: "sensor_msgs/msg/LaserScan"
  gz_type_name: "gz.msgs.LaserScan"
  direction: GZ_TO_ROS

# Simulation clock (drives use_sim_time everywhere): Gazebo -> ROS
- ros_topic_name: "clock"
  gz_topic_name: "clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS

# The robot's own world pose. ros_gz_bridge DROPS per-entity names when converting the bulk
# gz.msgs.Pose_V topic, so every model needs its own named PosePublisher topic instead.
- ros_topic_name: "/model/robofetch/pose"
  gz_topic_name: "/model/robofetch/pose"
  ros_type_name: "geometry_msgs/msg/Pose"
  gz_type_name: "gz.msgs.Pose"
  direction: GZ_TO_ROS

# ------------------------------- parcel_1 -------------------------------
- ros_topic_name: "/gripper/parcel_1/attach"
  gz_topic_name: "/gripper/parcel_1/attach"
  ros_type_name: "std_msgs/msg/Empty"
  gz_type_name: "gz.msgs.Empty"
  direction: ROS_TO_GZ

- ros_topic_name: "/gripper/parcel_1/detach"
  gz_topic_name: "/gripper/parcel_1/detach"
  ros_type_name: "std_msgs/msg/Empty"
  gz_type_name: "gz.msgs.Empty"
  direction: ROS_TO_GZ

# The DetachableJoint's own attach state - the AUTHORITATIVE answer to "is the parcel really
# held?", far better than guessing from proximity. Publishes only on transitions.
- ros_topic_name: "/gripper/parcel_1/state"
  gz_topic_name: "/gripper/parcel_1/state"
  ros_type_name: "std_msgs/msg/String"
  gz_type_name: "gz.msgs.StringMsg"
  direction: GZ_TO_ROS

# World pose, used to verify a delivery physically happened (proposal C3).
- ros_topic_name: "/model/parcel_1/pose"
  gz_topic_name: "/model/parcel_1/pose"
  ros_type_name: "geometry_msgs/msg/Pose"
  gz_type_name: "gz.msgs.Pose"
  direction: GZ_TO_ROS

